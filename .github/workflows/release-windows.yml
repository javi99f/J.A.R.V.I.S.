name: Publicar actualización para Windows

on:
  push:
    tags:
      - "windows-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          choco install innosetup --no-progress -y

      - name: Comprobar etiqueta de Windows
        shell: pwsh
        run: |
          $version = (Get-Content -Raw WINDOWS_VERSION).Trim()
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "windows-v$version") {
            throw "La etiqueta ${{ github.ref_name }} no coincide con WINDOWS_VERSION=$version."
          }

      - name: Construir y verificar el instalador
        shell: pwsh
        run: .\build_windows.ps1

      - name: Publicar GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $title = "Jarvis Windows v$((Get-Content -Raw WINDOWS_VERSION).Trim())"
          $assets = @(
            "dist-installer/Jarvis-Setup.exe"
            "dist-installer/jarvis-windows-manifest.json"
            "dist-installer/SHA256SUMS.txt"
          )
          if (gh release view $tag 2>$null) {
            gh release upload $tag @assets --clobber
            gh release edit $tag --title $title --notes-file CHANGELOG_WINDOWS.md
          } else {
            gh release create $tag @assets --title $title --notes-file CHANGELOG_WINDOWS.md
          }

      - name: Guardar instalador de prueba
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows
          path: |
            dist-installer/Jarvis-Setup.exe
            dist-installer/jarvis-windows-manifest.json
            dist-installer/SHA256SUMS.txt
